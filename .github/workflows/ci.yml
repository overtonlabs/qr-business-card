# Quality gates for the QR Business Card generator.
#
# Runs the dependency-free unit suite and the Playwright round-trip suite, which fills the real form,
# reads the rendered canvas and decodes the QR code back to a string.
#
# This workflow is also called by static.yml before it deploys, so the published site can never be
# built from a commit whose tests fail.

name: CI

on:
  pull_request:
  push:
    # Pushes to main are covered by the deploy workflow, which calls this one before publishing
    branches-ignore: ['main']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the current release
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7
